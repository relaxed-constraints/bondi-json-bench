# Project settings; CSS lists replace the inherited list, so retain the shared stylesheet.
INHERIT: .relcon-docs/base.yml
site_name: BONDI JSON Bench
site_description: An analytical document database benchmark built on BONDI
site_url: https://relaxed-constraints.github.io/bondi-json-bench/
repo_url: https://github.com/relaxed-constraints/bondi-json-bench
repo_name: relaxed-constraints/bondi-json-bench
copyright: Copyright &copy; 2026 Relaxed Constraints
nav:
- Home: index.md
- Getting started:
  - Installation: installation.md
  - Quickstart: quickstart.md
- User guide:
  - Overview: user-guide.md
  - CLI workflow: cli.md
  - Yanex workflow: yanex.md
  - Troubleshooting: troubleshooting.md
- Benchmark design:
  - Overview: design.md
  - Travel dataset: data.md
  - Query templates: queries.md
  - Baseline indexes: indexes.md
  - Equivalence checks: validation.md
  - Execution and metrics: analysis.md
  - Reading the figures: plotting.md
- Results: results.md
- Reference:
  - CLI:
    - Overview: reference/cli/index.md
    - prepare: reference/cli/prepare.md
    - benchmark: reference/cli/benchmark.md
    - plot: reference/cli/plot.md
    - cleanup: reference/cli/cleanup.md
  - Python API:
    - Overview: reference/index.md
    - Data: reference/data.md
    - Queries: reference/queries.md
    - Validation: reference/validation.md
    - Preparation: reference/preparation.md
    - Experiments: reference/experiments.md
    - Analysis: reference/analysis.md
    - Plotting: reference/plotting.md
  - Shared execution guide: experiments.md
- Development:
  - Overview: development/index.md
  - Architecture: development/architecture.md
  - Extending the benchmark: development/extending.md
  - Testing: development/testing.md
  - Documentation: development/documentation.md
  - Changelog: development/changelog.md
extra_css:
- stylesheets/relcon-docs.css
- stylesheets/results.css
plugins:
  mkdocstrings:
    handlers:
      python:
        paths:
        - src
        options:
          show_root_heading: true
          heading_level: 2
