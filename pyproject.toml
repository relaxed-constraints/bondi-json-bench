[project]
name = "bondi-json-bench"
authors = [{ name = "Thomas Rueckstiess", email = "thomas@relcon.ai" }]
version = "0.1.0"
description = "A document database benchmark built on BONDI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yanex==0.7.0",
    "click>=8.1,<9",
    "rich>=13,<15",
    "pymongo>=4.13,<5",
    "huggingface-hub>=0.30,<2",
    "pandas>=3.1.0",
    "matplotlib>=3.11.2",
    "ipykernel>=7.4.0",
    "bondi[couchbase]==0.3.1",
    "faker==38.3.0",
]

[project.scripts]
json-bench = "json_bench.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/json_bench"]

[tool.hatch.build.targets.wheel.force-include]
"experiments/templates" = "json_bench/assets/templates"
"experiments/indexes.json" = "json_bench/assets/indexes.json"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
docs = ["relcon-docs @ git+https://github.com/relaxed-constraints/relcon-docs.git@ea4aa3ded66f09a8963a5f12655f9e601e286400"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
