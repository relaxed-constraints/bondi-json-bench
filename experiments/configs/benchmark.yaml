backend: mongodb
clients: 2
seed: 23

load:
  warmup_seconds: 60
  measurement_seconds: 180
  drain_timeout_seconds: 60
  # Q1 through Q8, in that order.
  weights: [1, 1, 1, 1, 1, 1, 1, 1]

executor:
  timeout_seconds: 60
  health_check_timeout_seconds: 60

queries:
  q4_location: Donnafurt

# Database startup is outside the measurement window.
deployment:
  startup_timeout_seconds: 300
