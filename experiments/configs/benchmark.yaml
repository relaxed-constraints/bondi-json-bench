backend: mongodb
clients: 2
seed: 23

load:
  warmup_seconds: 5
  measurement_seconds: 15
  drain_timeout_seconds: 15
  # Q1 through Q8, in that order.
  weights: [1, 1, 1, 1, 1, 1, 1, 1]

executor:
  timeout_seconds: 10
  health_check_timeout_seconds: 30

queries:
  q4_location: Donnafurt

# Database startup is outside the measurement window.
deployment:
  startup_timeout_seconds: 300
