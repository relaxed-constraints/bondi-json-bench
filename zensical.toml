[project]
site_url = "https://relaxed-constraints.github.io/bondi-json-bench/"
repo_url = "https://github.com/relaxed-constraints/bondi-json-bench"
repo_name = "relaxed-constraints/bondi-json-bench"
site_name = "BONDI JSON Bench"
site_description = "An analytical document database benchmark built on BONDI"
copyright = "Copyright &copy; 2026 Relaxed Constraints"
extra_css = ["stylesheets/markdown-copy.css", "stylesheets/diagrams.css"]
nav = [
 { "Home" = "index.md" },
 { "Getting started" = [{ "Installation" = "installation.md" }, { "Quickstart" = "quickstart.md" }] },
 { "User guide" = [{ "Overview" = "user-guide.md" }, { "CLI workflow" = "cli.md" }, { "Yanex workflow" = "yanex.md" }, { "Troubleshooting" = "troubleshooting.md" }] },
 { "Benchmark design" = [{ "Overview" = "design.md" }, { "Travel dataset" = "data.md" }, { "Query templates" = "queries.md" }, { "Baseline indexes" = "indexes.md" }, { "Equivalence checks" = "validation.md" }, { "Execution and metrics" = "analysis.md" }, { "Reading the figures" = "plotting.md" }] },
 { "Results" = "results.md" },
 { "Reference" = [
   { "CLI" = [{ "Overview" = "reference/cli/index.md" }, { "prepare" = "reference/cli/prepare.md" }, { "benchmark" = "reference/cli/benchmark.md" }, { "plot" = "reference/cli/plot.md" }, { "cleanup" = "reference/cli/cleanup.md" }] },
   { "Python API" = [{ "Overview" = "reference/index.md" }, { "Data" = "reference/data.md" }, { "Queries" = "reference/queries.md" }, { "Validation" = "reference/validation.md" }, { "Preparation" = "reference/preparation.md" }, { "Experiments" = "reference/experiments.md" }, { "Analysis" = "reference/analysis.md" }, { "Plotting" = "reference/plotting.md" }] },
   { "Shared execution guide" = "experiments.md" }
 ] },
 { "Development" = [{ "Overview" = "development/index.md" }, { "Architecture" = "development/architecture.md" }, { "Extending the benchmark" = "development/extending.md" }, { "Testing" = "development/testing.md" }, { "Documentation" = "development/documentation.md" }, { "Changelog" = "development/changelog.md" }] }
]

[project.theme]
variant = "modern"
font = false
features = ["content.action.copy", "content.tabs.link", "content.code.copy", "navigation.tabs", "navigation.top", "search.highlight"]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.admonition]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.highlight"]

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = true
heading_level = 2
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
line_length = 76

