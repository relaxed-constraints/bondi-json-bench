name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:
env:
  JSONBENCH_LIVE: "0"
  MPLBACKEND: Agg
permissions:
  contents: read
jobs:
  tests:
    name: Python ${{ matrix.python }} offline tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
  quality:
    name: Lint, docs and distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python tools/generate_cli_reference.py --check
      - run: uv run zensical build --strict
      - run: uv build --out-dir release-dist
      - run: uvx --from twine twine check --strict release-dist/*
      - name: Install the built wheel outside the checkout
        run: |
          uv venv /tmp/jsonbench-wheel
          uv pip install --refresh-package bondi --python /tmp/jsonbench-wheel/bin/python release-dist/*.whl
          cd /tmp
          /tmp/jsonbench-wheel/bin/json-bench --help
          /tmp/jsonbench-wheel/bin/python -c "from importlib.metadata import version; from importlib.resources import files; assert version('bondi') == '0.3.1'; assert files('json_bench').joinpath('assets/templates/q1.json').is_file(); assert files('json_bench').joinpath('assets/indexes.json').is_file()"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: release-dist/
